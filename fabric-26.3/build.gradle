plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-26.3"
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	mods {
		"key-holder" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDir rootProject.file("common/src/main/java")
			srcDir rootProject.file("fabric/src/main/java")
		}
		resources {
			srcDir rootProject.file("fabric/src/main/resources")
		}
	}
}

dependencies {
	// Non-remapping Loom for 26.x, so mod deps use standard configurations, not modImplementation.
	minecraft "com.mojang:minecraft:${project.mc263_minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.mc263_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.mc263_fabric_version}"

	api("me.shedaniel.cloth:cloth-config-fabric:${project.mc263_cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	api "com.terraformersmc:modmenu:${project.mc263_modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mod_id", project.mod_id
	inputs.property "mod_name", project.mod_name
	inputs.property "mod_license", project.mod_license
	inputs.property "loader_version", project.mc263_loader_version
	inputs.property "minecraft_version", project.mc263_minecraft_version

	filesMatching("fabric.mod.json") {
		expand(
			"version": inputs.properties.version,
			"mod_id": inputs.properties.mod_id,
			"mod_name": inputs.properties.mod_name,
			"mod_license": inputs.properties.mod_license,
			"loader_version": inputs.properties.loader_version,
			"minecraft_version": inputs.properties.minecraft_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
